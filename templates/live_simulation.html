<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Krypto Bot Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0a1a;
            color: #eee;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #00ff88;
            font-size: 2.5em;
            text-shadow: 0 0 30px rgba(0, 255, 136, 0.3);
        }
        
        .status-bar {
            background: #1a1a3e;
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #2a2a5e;
        }
        
        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff4444;
            transition: background 0.3s;
        }
        
        .status-dot.active {
            background: #00ff88;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.5);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .btn-start {
            background: #00ff88;
            color: #0a0a1a;
        }
        
        .btn-start:hover {
            background: #00cc66;
            transform: scale(1.05);
        }
        
        .btn-stop {
            background: #ff4444;
            color: white;
        }
        
        .btn-stop:hover {
            background: #cc3333;
            transform: scale(1.05);
        }
        
        .btn-reset {
            background: #4444ff;
            color: white;
        }
        
        .btn-reset:hover {
            background: #3333cc;
            transform: scale(1.05);
        }
        
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }
        
        .dashboard {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        
        .card {
            background: #1a1a3e;
            padding: 20px;
            border-radius: 15px;
            border: 1px solid #2a2a5e;
        }
        
        .card h3 {
            color: #00ff88;
            margin-bottom: 15px;
        }
        
        .chart-container {
            height: 400px;
            position: relative;
        }
        
        .live-price {
            font-size: 2em;
            font-weight: bold;
            color: #00ff88;
            text-align: center;
            margin: 10px 0;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }
        
        .stat-item {
            background: #0a0a2e;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        
        .stat-item .label {
            font-size: 0.8em;
            color: #888;
            margin-bottom: 5px;
        }
        
        .stat-item .value {
            font-size: 1.2em;
            font-weight: bold;
        }
        
        .stat-item .value.positive {
            color: #00ff88;
        }
        
        .stat-item .value.negative {
            color: #ff4444;
        }
        
        .signal-display {
            text-align: center;
            padding: 15px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.2em;
        }
        
        .signal-display.buy {
            background: rgba(0, 255, 136, 0.2);
            color: #00ff88;
            border: 2px solid #00ff88;
        }
        
        .signal-display.sell {
            background: rgba(255, 68, 68, 0.2);
            color: #ff4444;
            border: 2px solid #ff4444;
        }
        
        .signal-display.hold {
            background: rgba(255, 255, 255, 0.05);
            color: #888;
            border: 2px solid #444;
        }
        
        .trades-container {
            max-height: 300px;
            overflow-y: auto;
        }
        
        .trades-container::-webkit-scrollbar {
            width: 6px;
        }
        
        .trades-container::-webkit-scrollbar-track {
            background: #0a0a2e;
            border-radius: 10px;
        }
        
        .trades-container::-webkit-scrollbar-thumb {
            background: #00ff88;
            border-radius: 10px;
        }
        
        .trade-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 6px;
            background: #0a0a2e;
            font-size: 0.9em;
            animation: slideIn 0.3s ease;
        }
        
        .trade-item.buy {
            border-left: 3px solid #00ff88;
        }
        
        .trade-item.sell {
            border-left: 3px solid #ff4444;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }
        
        .progress-bar {
            width: 100%;
            height: 4px;
            background: #0a0a2e;
            border-radius: 2px;
            margin-top: 10px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            width: 0%;
            transition: width 0.5s ease;
        }
        
        @media (max-width: 900px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🚀 Live Bot Simulator</h1>
        
        <div class="status-bar">
            <div class="status-indicator">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText">Väntar på start</span>
            </div>
            <div class="controls">
                <button class="btn btn-start" id="startBtn" onclick="startSimulation()">▶ Starta</button>
                <button class="btn btn-stop" id="stopBtn" onclick="stopSimulation()" disabled>⏹ Stoppa</button>
                <button class="btn btn-reset" id="resetBtn" onclick="resetSimulation()" disabled>↺ Återställ</button>
            </div>
        </div>
        
        <div class="dashboard">
            <div class="card">
                <h3>📈 Live Pris & Portfölj</h3>
                <div class="live-price" id="livePrice">$0.00</div>
                <div class="signal-display hold" id="signalDisplay">VÄNTAR PÅ DATA</div>
                <div class="chart-container">
                    <canvas id="priceChart"></canvas>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
            </div>
            
            <div class="card">
                <h3>📊 Portfölj</h3>
                <div class="stats-grid">
                    <div class="stat-item">
                        <div class="label">Totalt värde</div>
                        <div class="value" id="totalValue">$10,000.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Avkastning</div>
                        <div class="value" id="returnValue">0.00%</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Kontanter</div>
                        <div class="value" id="cashValue">$10,000.00</div>
                    </div>
                    <div class="stat-item">
                        <div class="label">Antal mynt</div>
                        <div class="value" id="holdingsValue">0.0000</div>
                    </div>
                </div>
                
                <h3>📝 Transaktioner</h3>
                <div class="trades-container" id="tradesList">
                    <div style="text-align: center; color: #888; padding: 20px;">
                        Väntar på affärer...
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const socket = io();
        let priceChart = null;
        let priceData = [];
        let labelData = [];
        let totalTrades = 0;
        
        // Initiera chart
        const ctx = document.getElementById('priceChart').getContext('2d');
        priceChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: labelData,
                datasets: [
                    {
                        label: 'Pris (USD)',
                        data: priceData,
                        borderColor: '#00ff88',
                        backgroundColor: 'rgba(0, 255, 136, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        tension: 0.4,
                        pointRadius: 0
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        labels: {
                            color: '#888'
                        }
                    }
                },
                scales: {
                    x: {
                        ticks: {
                            color: '#666',
                            maxTicksLimit: 15
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    },
                    y: {
                        ticks: {
                            color: '#666'
                        },
                        grid: {
                            color: 'rgba(255,255,255,0.05)'
                        }
                    }
                }
            }
        });
        
        // WebSocket-eventhanterare
        socket.on('connect', function() {
            console.log('Ansluten till servern');
        });
        
        socket.on('price_update', function(data) {
            // Uppdatera live-pris
            document.getElementById('livePrice').textContent = `$${data.price.toFixed(2)}`;
            
            // Uppdatera signal
            const signalDisplay = document.getElementById('signalDisplay');
            signalDisplay.textContent = `SIGNAL: ${data.signal}`;
            signalDisplay.className = `signal-display ${data.signal.toLowerCase()}`;
            
            // Uppdatera portfölj
            document.getElementById('totalValue').textContent = `$${data.portfolio.total_value.toFixed(2)}`;
            document.getElementById('cashValue').textContent = `$${data.portfolio.cash.toFixed(2)}`;
            document.getElementById('holdingsValue').textContent = data.portfolio.holdings.toFixed(6);
            
            // Beräkna avkastning
            const returnPercent = ((data.portfolio.total_value - 10000) / 10000) * 100;
            const returnElement = document.getElementById('returnValue');
            returnElement.textContent = returnPercent.toFixed(2) + '%';
            returnElement.className = 'value ' + (returnPercent >= 0 ? 'positive' : 'negative');
            
            // Uppdatera chart
            labelData.push(data.timestamp);
            priceData.push(data.price);
            if (labelData.length > 300) {
                labelData.shift();
                priceData.shift();
            }
            priceChart.update();
            
            // Uppdatera progress
            document.getElementById('progressFill').style.width = data.progress + '%';
            
            // Lägg till trade om det finns
            if (data.trade) {
                totalTrades++;
                const tradesList = document.getElementById('tradesList');
                const tradeDiv = document.createElement('div');
                tradeDiv.className = `trade-item ${data.trade.type.toLowerCase()}`;
                tradeDiv.innerHTML = `
                    <span>${data.trade.timestamp}</span>
                    <span><strong>${data.trade.type}</strong></span>
                    <span>${data.trade.amount.toFixed(6)} st</span>
                    <span>$${data.trade.price.toFixed(2)}</span>
                    <span>$${data.trade.value.toFixed(2)}</span>
                `;
                tradesList.prepend(tradeDiv);
                
                // Ta bort äldre trades om det blir för många
                while (tradesList.children.length > 50) {
                    tradesList.removeChild(tradesList.lastChild);
                }
            }
            
            // Uppdatera status
            document.getElementById('statusText').textContent = 'Simulerar live...';
            document.getElementById('statusDot').className = 'status-dot active';
        });
        
        socket.on('simulation_complete', function(data) {
            document.getElementById('statusText').textContent = '✅ Simulering klar!';
            document.getElementById('statusDot').className = 'status-dot';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('stopBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
            
            alert(`Simulering klar!\nFinalt värde: $${data.final_value.toFixed(2)}\nAntal affärer: ${data.trades.length}`);
        });
        
        // Funktioner för knappar
        async function startSimulation() {
            const symbol = 'bitcoin'; // Kan göras dynamisk
            
            document.getElementById('startBtn').disabled = true;
            document.getElementById('stopBtn').disabled = false;
            document.getElementById('resetBtn').disabled = true;
            document.getElementById('statusText').textContent = 'Startar...';
            
            try {
                const response = await fetch('/api/start_simulation', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ symbol: symbol })
                });
                
                const data = await response.json();
                if (data.error) {
                    alert('Fel: ' + data.error);
                    return;
                }
                
                document.getElementById('statusText').textContent = 'Simulerar live...';
                document.getElementById('statusDot').className = 'status-dot active';
                
                // Rensa gamla trades
                document.getElementById('tradesList').innerHTML = '';
                totalTrades = 0;
                
            } catch (error) {
                alert('Fel vid start: ' + error.message);
                document.getElementById('startBtn').disabled = false;
            }
        }
        
        async function stopSimulation() {
            try {
                await fetch('/api/stop_simulation', { method: 'POST' });
                document.getElementById('statusText').textContent = 'Stoppad';
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('resetBtn').disabled = false;
            } catch (error) {
                console.error('Fel vid stopp:', error);
            }
        }
        
        async function resetSimulation() {
            try {
                await fetch('/api/reset_simulation', { method: 'POST' });
                
                // Återställ UI
                document.getElementById('livePrice').textContent = '$0.00';
                document.getElementById('totalValue').textContent = '$10,000.00';
                document.getElementById('cashValue').textContent = '$10,000.00';
                document.getElementById('holdingsValue').textContent = '0.0000';
                document.getElementById('returnValue').textContent = '0.00%';
                document.getElementById('returnValue').className = 'value';
                document.getElementById('progressFill').style.width = '0%';
                document.getElementById('signalDisplay').textContent = 'VÄNTAR PÅ DATA';
                document.getElementById('signalDisplay').className = 'signal-display hold';
                document.getElementById('tradesList').innerHTML = '<div style="text-align: center; color: #888; padding: 20px;">Väntar på affärer...</div>';
                document.getElementById('statusText').textContent = 'Återställd';
                document.getElementById('statusDot').className = 'status-dot';
                document.getElementById('startBtn').disabled = false;
                document.getElementById('stopBtn').disabled = true;
                document.getElementById('resetBtn').disabled = true;
                
                // Återställ chart
                labelData = [];
                priceData = [];
                priceChart.update();
                
            } catch (error) {
                console.error('Fel vid återställning:', error);
            }
        }
    </script>
</body>
</html>
